<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MoodVerse — Where Stories Become Music" />
  <meta name="theme-color" content="#090912" />
  <title>MoodVerse | Official Links</title>
  <style>
    :root{
      --bg:#080810;
      --text:#faf9ff;
      --muted:#b9b5c9;
      --line:rgba(255,255,255,.13);
      --panel:rgba(255,255,255,.07);
      --panel-hover:rgba(255,255,255,.12);
      --accent:#a88cff;
      --accent2:#64d8ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 20% 10%,rgba(168,140,255,.24),transparent 34%),
        radial-gradient(circle at 85% 0%,rgba(100,216,255,.18),transparent 28%),
        linear-gradient(180deg,#0a0a14,#07070d);
      padding:24px 16px;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.08;
      background-image:radial-gradient(circle,white 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:linear-gradient(to bottom,black,transparent 80%);
    }
    .page{width:min(100%,500px);position:relative;z-index:1}
    .card{
      padding:30px 18px 22px;
      border:1px solid var(--line);
      border-radius:30px;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
      box-shadow:0 24px 80px rgba(0,0,0,.48);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .logo{
      width:96px;height:96px;margin:0 auto 16px;
      border-radius:50%;
      display:grid;place-items:center;
      background:conic-gradient(from 220deg,var(--accent),var(--accent2),var(--accent));
      box-shadow:0 0 44px rgba(168,140,255,.28);
    }
    .logo-inner{
      width:80px;height:80px;border-radius:50%;
      display:grid;place-items:center;
      background:#090912;
      font-size:25px;font-weight:800;letter-spacing:.08em;
    }
    h1{margin:0;text-align:center;font-size:30px;letter-spacing:.02em}
    .tagline{text-align:center;color:var(--muted);margin:8px 0 4px;font-size:14px}
    .sub{text-align:center;color:#dedbea;margin:0 0 24px;font-size:13px}
    .section-title{
      margin:0 0 12px;
      text-align:center;
      font-size:13px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent2);
      font-weight:800;
    }
    .links{display:grid;gap:12px}
    .link{
      min-height:60px;
      display:flex;align-items:center;gap:13px;
      padding:12px 15px;
      border:1px solid var(--line);
      border-radius:18px;
      color:var(--text);
      text-decoration:none;
      background:var(--panel);
      transition:.2s ease;
    }
    .link:hover,.link:focus-visible{
      transform:translateY(-2px);
      background:var(--panel-hover);
      border-color:rgba(168,140,255,.55);
      outline:none;
    }
    .icon{
      width:38px;height:38px;flex:0 0 38px;
      display:grid;place-items:center;
      border-radius:12px;background:rgba(255,255,255,.08);
      font-size:18px;
    }
    .label{flex:1;font-weight:750;font-size:15px}
    .arrow{font-size:20px;opacity:.55}
    footer{text-align:center;margin-top:17px;color:#908b9e;font-size:12px}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="logo"><div class="logo-inner">MV</div></div>

      <h1>MoodVerse</h1>
      <p class="tagline">Where Stories Become Music</p>
      <p class="sub">Human Stories • AI as a Tool</p>

      <p class="section-title">Explore MoodVerse</p>

      <nav class="links" aria-label="Official MoodVerse links">
        <a class="link" href="https://www.youtube.com/@moodverse_ir" target="_blank" rel="noopener">
          <span class="icon">▶</span>
          <span class="label">YouTube</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="https://t.me/Moodverse_ir" target="_blank" rel="noopener">
          <span class="icon">✈</span>
          <span class="label">Telegram</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="https://www.instagram.com/moodverse_ir" target="_blank" rel="noopener">
          <span class="icon">◎</span>
          <span class="label">Instagram</span>
          <span class="arrow">›</span>
        </a>

        <!-- بعداً می‌توانی دکمه‌های Spotify و Apple Music را اینجا اضافه کنی -->
      </nav>
    </section>

    <footer>© <span id="year"></span> MoodVerse</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
